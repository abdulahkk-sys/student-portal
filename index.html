<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
    h1 { color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #0070f3; color: white; }
  </style>
</head>
<body>
  <h1>Student Records</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Roll No</th>
        <th>Department</th>
      </tr>
    </thead>
    <tbody id="student-table">
      <tr><td colspan="4">Loading data...</td></tr>
    </tbody>
  </table>

  <script>
    async function fetchStudents() {
      try {
        const response = await fetch('/.netlify/functions/get-students');
        const data = await response.json();
        
        const tableBody = document.getElementById('student-table');
        tableBody.innerHTML = '';

        if (!data || data.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4">No records found.</td></tr>';
          return;
        }

        data.forEach(student => {
          const row = `<tr>
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.roll_no}</td>
            <td>${student.department}</td>
          </tr>`;
          tableBody.innerHTML += row;
        });
      } catch (err) {
        document.getElementById('student-table').innerHTML = `<tr><td colspan="4">Error loading data</td></tr>`;
      }
    }

    fetchStudents();
  </script>
</body>
</html>
